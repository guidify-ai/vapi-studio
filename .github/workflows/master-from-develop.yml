# Required check on master: pull requests into master may only come from develop in this repository.
# pull_request_target runs this file from master, so a pull request cannot change the check itself.
name: Master PR source

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  master-from-develop:
    name: master-from-develop
    runs-on: ubuntu-latest
    steps:
      - name: Only develop can be merged into master
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into master must come from develop in $GITHUB_REPOSITORY, not $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
          echo "From $HEAD_REPO:$HEAD_REF, OK."
