version: 1
flow:
  id: sample-landing-demo
  start: acknowledge
nodes:
  acknowledge:
    class: AcknowledgeNode
    intentions:
      - phone_demo_clarify
      - studio.isGoodbye
  topicWhat:
    class: PhoneDemoWhatNode
    intentions:
      - phone_demo_what
  topicCost:
    class: PhoneDemoCostNode
    intentions:
      - phone_demo_cost
  topicNotDev:
    class: PhoneDemoNotDevNode
    intentions:
      - phone_demo_not_dev
  leadGen:
    class: PhoneDemoLeadNode
    intentions:
      - phone_demo_use_case
      - studio.isGoodbye
  heardAbout:
    class: PhoneDemoHeardAboutNode
    intentions:
      - phone_demo_heard_about
      - studio.isGoodbye
  farewell:
    class: GoodbyeNode
    terminal: true
    intentions:
      - studio.isGoodbye
      - nothing_else
  continue:
    class: ContinueNode
    intentions:
      - isContinue
  unknownTransition:
    class: UnknownTransitionNode
    portal: true
    priority: 80
    intentions:
      - studio.isUnknownTransition
      - isContinue
  stillThere:
    class: StillThereNode
    portal: true
    priority: 92
    intentions:
      - studio.isStillThere
      - studio.isPositive
      - studio.isGoodbye
      - isContinue
  mad:
    class: MadNode
    portal: true
    priority: 95
    intentions:
      - studio.isMad
      - isContinue
  transferToHuman:
    class: TransferToHumanNode
    portal: true
    priority: 98
    intentions:
      - studio.isTransferToHuman
      - isContinue
