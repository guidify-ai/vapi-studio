<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversation — Sample Landing LLM</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ink: #e7ecf1;
      --muted: #8b9aab;
      --border: #2a3542;
      --accent: #e9c46a;
      --link: #5eead4;
      --user: #3d5a80;
      --bot: #2a9d8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 0.9rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.05rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button, .btn {
      background: #243040;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: #2c3a4d; }
    .btn.primary { background: #2d6a4f; border-color: #52b788; }
    .btn.vapi { background: #4a3f6b; border-color: #a78bfa; }
    .ext::after { content: " ↗"; font-size: 0.7em; opacity: 0.7; }
    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px 20px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    .meta { color: var(--muted); font-size: 0.8rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #141b24;
    }
    .chat-log {
      padding: 14px;
      max-height: 70vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .chat-row.user { flex-direction: row-reverse; }
    .bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-row.user .bubble { background: var(--user); }
    .chat-row.assistant .bubble { background: var(--bot); }
    .role {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .side { display: flex; flex-direction: column; gap: 16px; }
    dl {
      margin: 0;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 0.82rem;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    pre.json {
      margin: 0;
      padding: 12px 14px;
      font-size: 0.72rem;
      overflow: auto;
      max-height: 240px;
      background: #0c1016;
    }
    .events {
      max-height: 320px;
      overflow: auto;
      font-size: 0.75rem;
    }
    .event {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .event-type { font-weight: 600; color: var(--accent); }
    #error { color: #f87171; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">Conversation</h1>
      <div class="meta" id="subtitle">Loading…</div>
    </div>
    <div class="toolbar">
      <a href="/conversations">← All conversations</a>
      <a href="/analytics">Analytics</a>
      <a href="/flow">Flow Studio</a>
      <a id="vapiLink" class="btn vapi ext" href="#" target="_blank" rel="noopener" hidden>Open in Vapi</a>
      <button type="button" id="btnRefresh">Refresh</button>
    </div>
  </header>
  <main id="main" hidden>
    <section class="panel">
      <h2>Chat history</h2>
      <div class="chat-log" id="chatLog"></div>
    </section>
    <aside class="side">
      <section class="panel">
        <h2>Summary</h2>
        <dl id="summary"></dl>
      </section>
      <section class="panel">
        <h2>Node path</h2>
        <pre class="json" id="nodePath"></pre>
      </section>
      <section class="panel">
        <h2>Memory</h2>
        <pre class="json" id="memory"></pre>
      </section>
      <section class="panel">
        <h2>Events <span id="eventCount" class="meta"></span></h2>
        <div class="events" id="events"></div>
      </section>
    </aside>
  </main>
  <div id="error" hidden></div>
  <script>
    function conversationIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('conversations');
      if (idx >= 0 && parts[idx + 1] && parts[idx + 1] !== 'api') {
        return parts[idx + 1];
      }
      return null;
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function appendChat(role, text) {
      const log = document.getElementById('chatLog');
      const row = document.createElement('div');
      row.className = 'chat-row ' + role;
      const wrap = document.createElement('div');
      const lab = document.createElement('div');
      lab.className = 'role';
      lab.textContent = role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text || '';
      wrap.appendChild(lab);
      wrap.appendChild(bubble);
      row.appendChild(wrap);
      log.appendChild(row);
    }

    function render(d) {
      document.getElementById('title').textContent =
        'Conversation ' + d.conversationId.slice(0, 8) + '…';
      document.getElementById('subtitle').textContent =
        (d.liveInMemory ? 'LIVE in memory · ' : '') +
        d.status +
        ' · ' +
        d.channel +
        (d.currentNodeId ? ' · node ' + d.currentNodeId : '');

      const vapi = document.getElementById('vapiLink');
      if (d.vapiCallUrl) {
        vapi.href = d.vapiCallUrl;
        vapi.hidden = false;
      } else {
        vapi.hidden = true;
      }

      const log = document.getElementById('chatLog');
      log.innerHTML = '';
      const chat = (d.history && d.history.chat) || [];
      if (!chat.length) {
        log.innerHTML = '<p class="meta" style="padding:8px">No chat messages in snapshot.</p>';
      } else {
        for (const m of chat) {
          if (m.role === 'user' || m.role === 'assistant') {
            appendChat(m.role, m.text);
          }
        }
      }

      const summary = document.getElementById('summary');
      const rows = [
        ['ID', d.conversationId],
        ['Provider call', d.providerCallId],
        ['Caller', d.callerId || '—'],
        ['Created', fmt(d.createdAt)],
        ['Ended', fmt(d.endedAt)],
        ['Last activity', fmt(d.lastActivityAt)],
        ['Current node', d.currentNodeId || '—'],
        ['Module', d.activeModuleId || '—'],
        ['Brain', d.brainProfileId || '—'],
      ];
      summary.innerHTML = rows
        .map(([k, v]) => '<dt>' + esc(k) + '</dt><dd class="mono">' + esc(v) + '</dd>')
        .join('');

      const nodes = (d.history && d.history.nodes) || [];
      document.getElementById('nodePath').textContent = nodes.length
        ? nodes
            .map(
              (n) =>
                n.turnNumber +
                ' ' +
                n.nodeId +
                ' ← ' +
                (n.intention || '?') +
                ' @ ' +
                n.at,
            )
            .join('\n')
        : '(empty)';

      document.getElementById('memory').textContent = JSON.stringify(
        d.memory || {},
        null,
        2,
      );

      const eventsEl = document.getElementById('events');
      document.getElementById('eventCount').textContent =
        '(' + (d.events || []).length + ')';
      if (!d.events || !d.events.length) {
        eventsEl.innerHTML = '<p class="meta" style="padding:12px">No events.</p>';
      } else {
        eventsEl.innerHTML = d.events
          .map(
            (ev) =>
              '<div class="event"><div class="event-type">' +
              esc(ev.type) +
              '</div><div class="meta">' +
              esc(fmt(ev.createdAt)) +
              '</div><pre class="json">' +
              esc(JSON.stringify(ev.payload, null, 2)) +
              '</pre></div>',
          )
          .join('');
      }

      document.getElementById('main').hidden = false;
    }

    async function load() {
      const id = conversationIdFromPath();
      const err = document.getElementById('error');
      err.hidden = true;
      if (!id) {
        err.textContent = 'Missing conversation id in URL.';
        err.hidden = false;
        return;
      }
      document.getElementById('subtitle').textContent = 'Loading…';
      try {
        const res = await fetch('/conversations/api/' + encodeURIComponent(id));
        if (!res.ok) throw new Error(await res.text());
        render(await res.json());
      } catch (e) {
        err.textContent = String(e.message || e);
        err.hidden = false;
        document.getElementById('main').hidden = true;
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
