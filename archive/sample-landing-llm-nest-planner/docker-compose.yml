services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: sample_landing_llm
    ports:
      - "15434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d sample_landing_llm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9998:9998"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://studio:studio@postgres:5432/sample_landing_llm
      PORT: 9998
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
