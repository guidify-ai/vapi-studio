<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conversations — Sample Landing LLM</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --ink: #e7ecf1;
      --muted: #8b9aab;
      --border: #2a3542;
      --accent: #e9c46a;
      --link: #5eead4;
      --active: #2d6a4f;
      --ended: #57534e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 0.9rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.1rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    button {
      background: #243040;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    button:hover { background: #2c3a4d; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    main { padding: 16px 20px 40px; max-width: 1200px; margin: 0 auto; }
    .meta { color: var(--muted); font-size: 0.8rem; }
    #status { margin-bottom: 12px; min-height: 1.2em; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: #141b24;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1f2833; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge.active { background: var(--active); color: #ecfdf5; }
    .badge.ended { background: var(--ended); color: #e7e5e4; }
    .badge.studio { background: #1d3557; color: #bfdbfe; }
    .badge.vapi { background: #4a3f6b; color: #ede9fe; }
    .mono { font-family: ui-monospace, monospace; font-size: 0.78rem; }
    .preview { color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .ext::after { content: " ↗"; font-size: 0.7em; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Conversations</h1>
      <div class="meta">Debug — durable Postgres history</div>
    </div>
    <div class="toolbar">
      <a href="/analytics">Analytics</a>
      <a href="/flow">Flow Studio</a>
      <button type="button" id="btnRefresh">Refresh</button>
    </div>
  </header>
  <main>
    <div id="status" class="meta">Loading…</div>
    <table>
      <thead>
        <tr>
          <th>When</th>
          <th>Status</th>
          <th>Channel</th>
          <th>Caller</th>
          <th>Node</th>
          <th>Last user</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="7" class="meta">Loading…</td></tr>
      </tbody>
    </table>
    <div class="toolbar" style="margin-top: 16px;">
      <button type="button" id="btnPrev">Newer</button>
      <span id="pageMeta" class="meta"></span>
      <button type="button" id="btnNext">Older</button>
    </div>
  </main>
  <script>
    const PAGE_SIZE = 50;
    let offset = 0;
    let total = 0;

    function fmt(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/"/g, '&quot;');
    }

    function statusBadge(status) {
      const cls = status === 'ACTIVE' ? 'active' : 'ended';
      return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
    }

    function channelBadge(channel) {
      return '<span class="badge ' + esc(channel) + '">' + esc(channel) + '</span>';
    }

    function renderRows(items) {
      const tbody = document.getElementById('rows');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="meta">No conversations yet.</td></tr>';
        return;
      }
      tbody.innerHTML = items.map((row) => {
        const actions = [
          '<a href="/conversations/' + esc(row.conversationId) + '">Open</a>',
        ];
        if (row.vapiCallUrl) {
          actions.push(
            '<a class="ext" href="' + esc(row.vapiCallUrl) + '" target="_blank" rel="noopener">Vapi</a>',
          );
        }
        return (
          '<tr>' +
          '<td class="mono">' + esc(fmt(row.createdAt)) + '</td>' +
          '<td>' + statusBadge(row.status) + '</td>' +
          '<td>' + channelBadge(row.channel) + '</td>' +
          '<td class="mono">' + esc(row.callerId || '—') + '</td>' +
          '<td class="mono">' + esc(row.currentNodeId || '—') + '</td>' +
          '<td class="preview" title="' + esc(row.chatPreview) + '">' + esc(row.chatPreview || '—') + '</td>' +
          '<td class="actions">' + actions.join(' · ') + '</td>' +
          '</tr>'
        );
      }).join('');
    }

    async function load() {
      const status = document.getElementById('status');
      status.textContent = 'Loading…';
      try {
        const res = await fetch(
          '/conversations/api?limit=' + PAGE_SIZE + '&offset=' + offset,
        );
        if (!res.ok) throw new Error(await res.text());
        const body = await res.json();
        total = body.total || 0;
        renderRows(body.items || []);
        const from = total ? offset + 1 : 0;
        const to = Math.min(offset + PAGE_SIZE, total);
        document.getElementById('pageMeta').textContent =
          total ? from + '–' + to + ' of ' + total : '0 conversations';
        document.getElementById('btnPrev').disabled = offset <= 0;
        document.getElementById('btnNext').disabled = offset + PAGE_SIZE >= total;
        status.textContent = '';
      } catch (err) {
        status.textContent = String(err.message || err);
        status.style.color = '#f87171';
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', () => load());
    document.getElementById('btnPrev').addEventListener('click', () => {
      offset = Math.max(0, offset - PAGE_SIZE);
      load();
    });
    document.getElementById('btnNext').addEventListener('click', () => {
      if (offset + PAGE_SIZE < total) {
        offset += PAGE_SIZE;
        load();
      }
    });
    load();
  </script>
</body>
</html>
